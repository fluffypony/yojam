<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Container unavailable · Yojam</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
      }

      p {
        line-height: 1.5;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Container unavailable</h1>
      <p>
        Yojam did not open the link because the requested container could not
        be found or accessed. Check that the named container exists and that
        the Yojam extension has permission to use contextual identities.
      </p>
    </main>
  </body>
</html>
